<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Pesanan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Tambahkan Google Font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div class="max-w-xl mx-auto bg-slate-50 min-h-screen relative pb-32">
        
        <!-- Header dengan efek modern -->
        <header class="bg-white p-5 sticky top-0 z-20 shadow-[0_2px_15px_-3px_rgba(0,0,0,0.05)] rounded-b-3xl mb-4">
            <h1 class="text-2xl font-bold text-center bg-clip-text text-transparent bg-gradient-to-r from-orange-500 to-red-500">
                Menu Resto
            </h1>
            <p class="text-center text-xs text-slate-400 mt-1 font-medium">Pesan makanan favoritmu sekarang</p>
        </header>

        <!-- Form Info Pembeli (Desain Soft Card) -->
        <div class="px-5 mb-6">
            <div class="bg-white p-5 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-2 uppercase tracking-wider">Nama Pemesan <span class="text-red-500">*</span></label>
                    <input type="text" id="customer-name" placeholder="Masukkan nama Anda" class="w-full bg-slate-50 border-none px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-400 transition font-medium text-slate-700">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-2 uppercase tracking-wider">Nomor Meja</label>
                    <input type="text" id="table-number" placeholder="Otomatis atau isi manual" class="w-full bg-slate-50 border-none px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-400 transition font-medium text-slate-700">
                </div>
            </div>
        </div>

        <!-- Daftar Menu -->
        <div id="menu-container" class="px-5 space-y-6">
            <!-- Menu dirender lewat JavaScript -->
        </div>

        <!-- Footer / Cart Total (Floating Bottom Bar) -->
        <div class="fixed bottom-0 left-0 right-0 max-w-xl mx-auto w-full z-20">
            <div class="bg-white p-5 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.08)] flex justify-between items-center">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide">Total Pembayaran</p>
                    <p id="total-price" class="text-xl font-bold text-orange-600 mt-1">Rp 0</p>
                </div>
                <button id="btn-pesan" onclick="showConfirmationModal()" class="bg-gradient-to-r from-orange-500 to-red-500 text-white px-8 py-3 rounded-2xl font-semibold shadow-lg shadow-orange-500/30 hover:shadow-orange-500/50 hover:scale-105 transition-all active:scale-95 disabled:opacity-50 disabled:pointer-events-none">
                    Pesan
                </button>
            </div>
        </div>

        <!-- Modal Konfirmasi (Glassmorphism effect) -->
        <div id="confirm-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-5 opacity-0 transition-opacity duration-300">
            <div class="bg-white rounded-3xl w-full max-w-sm p-7 shadow-2xl transform scale-95 transition-transform duration-300">
                <div class="w-16 h-16 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-4 text-orange-500">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                </div>
                <h3 class="text-xl font-bold text-slate-800 text-center mb-2">Konfirmasi Pesanan</h3>
                <p class="text-sm text-slate-500 text-center mb-6">Pastikan pesanan dan nama Anda sudah sesuai. Makanan akan segera disiapkan!</p>
                <div class="flex flex-col gap-3">
                    <button onclick="processOrder()" class="w-full py-3 text-white bg-orange-500 rounded-xl font-semibold hover:bg-orange-600 transition">Kirim Pesanan</button>
                    <button onclick="closeConfirmationModal()" class="w-full py-3 text-slate-500 bg-slate-100 rounded-xl font-semibold hover:bg-slate-200 transition">Batal</button>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loading" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex flex-col justify-center items-center text-white">
            <div class="animate-spin rounded-full h-14 w-14 border-4 border-orange-500 border-t-transparent mb-4"></div>
            <p class="font-medium text-lg tracking-wide">Mengirim Pesanan...</p>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
